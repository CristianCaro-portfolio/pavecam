[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pavecam"
version = "0.1.0"
description = "Roadside cameras as virtual pavement sensors, trained with RWIS pavement sensors as free labels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cristian Caro" }]
dependencies = [
    "numpy>=1.26",
    "polars>=1.20",
    "pyarrow>=15",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pillow>=10",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "prefect>=3.0",
    "mlflow-skinny>=2.16",
]

[project.optional-dependencies]
vision = ["torch>=2.3", "open_clip_torch>=3.0", "timm>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pavecam = "pavecam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
